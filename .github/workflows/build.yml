# Builds the 7-Zip console version ("7zz" — the standalone console binary with
# all codecs compiled in) for Windows x64, Linux x64 and macOS arm64, and
# publishes the result as ONE rolling "nightly" GitHub Release that is
# replaced on every run (release tag: `nightly`).
#
# Triggers:
#   * push       — every commit to main
#   * schedule   — every day at 03:00 UTC (nightly)
#   * workflow_dispatch — manual trigger (Actions tab -> Run workflow);
#                         input `force` rebuilds even when nothing changed
#
# Change gate (job `changes`): the build only runs when something that can
# affect the binaries changed since the commit the last `nightly` release was
# built from. That commit is the target of the `nightly` tag, which the release
# job creates. Git history, i.e. the commit, is the record of "a change in the
# repo" — comparing against it means a scheduled run with no new commits, or a
# push that only touched documentation, costs a few seconds instead of a full
# three-platform rebuild + release. Documentation (DOC/, *.md) is excluded;
# workflow files are not, because editing them changes how the binary is built
# and should therefore be exercised by a real run.
#
# Runners are pinned to the documented images:
#   * windows-2025  — VS Enterprise 2026 18.9 (MSVC 14.51 toolset)
#   * ubuntu-26.04  — GCC 15.2, make, zip, file preinstalled
#   * macos-26      — Xcode 26.6 / Apple clang 21 (arm64)
# Nothing needs to be installed on any runner.
#
# Toolchains: Windows = MSVC (cl), Linux = GCC, macOS = Apple clang.
# Every flag below is taken from the official compiler references, which are
# also mirrored locally in AI-Agents-Docs/:
#   MSVC : https://learn.microsoft.com/en-us/cpp/build/reference/compiler-options
#          (/O1 /O2, /Ob, /Oi, /Ot, /Oy, /arch, /GL, /Gw, /Zc:inline, /favor)
#   Clang: https://clang.llvm.org/docs/ClangCommandLineReference.html
#          (plus clang/docs/CommandGuide/clang.md for -mcpu/-march handling)
#   GCC  : https://gcc.gnu.org/onlinedocs/
#          (Optimize Options, Code Gen Options, Overall Options, x86 Options,
#           Link Options)
#
# The three build jobs hand their binaries to the release job via short-lived
# transport artifacts (1 day retention, deleted again once the release is
# published) — the actual deliverable is the GitHub Release.
#
# Forks are no-ops: every job is gated on github.repository, so only runs in
# Mitra-88/7zip build binaries and publish releases.
#
# Optimization flags are injected through hooks the makefiles already provide
# (no source/makefile edits; see comments per job). Under GCC and clang the
# x86-64 targets use the x86-64-v3 micro-architecture level of the x86-64
# psABI — the clang reference spells the level out as AVX, AVX2, BMI1, BMI2,
# F16C, FMA, LZCNT, MOVBE, XSAVE (needs Intel Haswell 2013+ / AMD Zen 2017+).
# MSVC has no equivalent switch: /arch:AVX2 is the closest documented x64
# option and is described there as AVX2 plus FMA and "certain BMI
# instructions", not as the whole psABI level. arm64 targets the Apple M-series
# level (apple-m1).

name: Nightly 7zz console

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build even if nothing changed since the last nightly release
        type: boolean
        default: false

permissions:
  contents: write
  # needed to list/delete the run's transport artifacts in the release job
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Change gate. Compares HEAD with the commit the current `nightly` release
  # was built from and publishes the answer as the `build` output. Paths that
  # cannot change the binary (DOC/, *.md) are ignored; if the tag or the diff is
  # unavailable the build runs, so a failure here never blocks a legitimate
  # build.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    if: github.repository == 'Mitra-88/7zip'
    outputs:
      build: ${{ steps.gate.outputs.build }}
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          fetch-depth: 0

      - name: Compare HEAD against the last nightly build
        id: gate
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "Manual run with force=true -> building."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE="$(git rev-list -n 1 refs/tags/nightly 2>/dev/null || true)"
          if [ -z "$BASE" ]; then
            echo "No previous 'nightly' release tag -> building."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Last built commit: $BASE"

          if [ "$BASE" = "$GITHUB_SHA" ]; then
            echo "HEAD is already the commit the last nightly was built from -> nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED="$(git diff --name-only "$BASE" "$GITHUB_SHA" -- . \
                       ':(exclude)DOC' ':(exclude)*.md' 2>/dev/null || echo FORCE)"

          if [ "$CHANGED" = "FORCE" ]; then
            echo "Could not diff $BASE..$GITHUB_SHA -> building."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$CHANGED" ]; then
            echo "Only DOC/ or *.md paths changed since the last nightly -> skipping the build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changed paths since the last nightly:"
            echo "$CHANGED"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Windows 10/11 x64 — MSVC (cl + ml64 from Build.mak).
  # MSVC has no "-march=x86-64-v3" switch, so /arch:AVX2 stands in for it; see
  # the /arch:AVX2 note below for how far that equivalence is documented to go.
  # /favor is left at its documented default (/favor:blend) because the binary
  # must run well on both Intel and AMD v3 CPUs — /favor:INTEL64 and
  # /favor:AMD64 each document worse performance on the other vendor.
  # Injection points (CPP/Build.mak):
  #   * CFLAGS_O1 / CFLAGS_O2 — overridden on the nmake command line.
  #     "$(CFLAGS)" inside the value expands to Build.mak's full flag chain
  #     (-MT -EHsc -GS- -Gy, all visible on the echoed cl lines in the log),
  #     and the trailing /O2 upgrades the /O1 that chain otherwise ends in for
  #     most C++ objects; Compress/, Crypto/ and the C sources already use /O2.
  #   * LFLAGS env var — prepended to the linker flag chain (adds /LTCG).
  # /O2 — documented as equivalent to /Og /Oi /Ot /Oy /Ob2 /GF /Gy; /Oy is
  #       x86-only ("in x64 compilers /Oy and /Oy- aren't available"), so on
  #       x64 the effective set is /Og /Oi /Ot /Ob2 /GF /Gy. /Ob2 and /Gy come
  #       from it, /Gy is also set explicitly by Build.mak.
  # /Ob3 — more aggressive inlining than the /Ob2 that /O2 implies (VS2019+;
  #       the image ships VS2026). The documented target here is speed.
  # /arch:AVX2 — closest documented x64 equivalent of the x86-64-v3 level:
  #       the /arch (x64) page names AVX2 plus FMA and "certain BMI
  #       instructions". MSVC does not define this switch in psABI-level terms,
  #       so F16C/LZCNT/MOVBE/XSAVE are not implied by the documentation.
  # /GL + /LTCG — whole-program optimization at compile and link time (cross-
  #       module inlining, register allocation across function boundaries,
  #       better global-data tracking)
  # /Gw — per-item COMDAT global data; with /GL the linker drops unreferenced
  #       global data and merges identical read-only data, using the /OPT:REF
  #       and /OPT:ICF that Build.mak already passes to link
  # /Zc:inline is deliberately NOT passed: the doc states it is not enabled
  #       when /GL is specified, which already does better COMDAT elimination.
  # ---------------------------------------------------------------------------
  windows-x64:
    name: Windows x64 (MSVC, /arch:AVX2)
    needs: changes
    runs-on: windows-2025
    timeout-minutes: 30
    if: github.repository == 'Mitra-88/7zip' && needs.changes.outputs.build == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7

      - name: Build 7zz.exe
        shell: cmd
        working-directory: CPP/7zip/Bundles/Alone2
        env:
          LFLAGS: /LTCG
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL (echo Visual Studio installation not found & exit /b 1)
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          nmake /NOLOGO -f makefile PLATFORM=x64 CFLAGS_O1="$(CFLAGS) /arch:AVX2 /GL /Gw /Ob3 /O2" CFLAGS_O2="$(CFLAGS) /arch:AVX2 /GL /Gw /Ob3 /O2"

      - name: Smoke test
        shell: cmd
        working-directory: CPP/7zip/Bundles/Alone2/x64
        run: 7zz.exe i | findstr /C:"7-Zip"

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item CPP/7zip/Bundles/Alone2/x64/7zz.exe dist/
          Copy-Item DOC/License.txt dist/

      - name: Upload (transport to release job)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 7zz-windows-x64-v3
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux x64 — GCC 15 (default on ubuntu-26.04) with the x86-64-v3
  # micro-architecture level.
  # Injection points (CPP/7zip/7zip_gcc.mak):
  #   * MY_ARCH — prepended to CFLAGS, CXXFLAGS and the link line.
  #     "-march=x86-64-v3" selects the x86-64 psABI micro-architecture level.
  #     The x86 Options page notes these level values have no matching -mtune
  #     setting and therefore enable generic tuning, and that specific tuning
  #     needs -mtune=<cpu> for a CPU that has to be known — so none is passed:
  #     the whole point of the level is to run on every v3 CPU of either
  #     vendor.
  #   * FLAGS_FLTO — appears AFTER the makefile's built-in "-O2" in every
  #     compile command (CFLAGS and CXXFLAGS) and is also passed to the link
  #     command, so the trailing "-O3" wins and the LTO/section flags apply at
  #     compile AND link time.
  #   * LDFLAGS_STATIC_3 — extra link flags.
  #   * CFLAGS_WARN_WALL — the makefile defaults to "-Werror -Wall -Wextra";
  #     dropping -Werror keeps warnings visible without letting a newer GCC
  #     major version fail the build. GCC 15 does emit one -Wstringop-overflow=
  #     warning from upstream Rar3Decoder.cpp on a write whose loop is
  #     bounds-checked, i.e. exactly the kind of diagnostic that must not stop
  #     a release.
  # Flag notes (GCC doc page in brackets):
  #   -O3            [Optimize Options] all -O2 passes plus, among others, loop
  #                  interchange and unrolling-and-jamming, loop distribution,
  #                  loop unswitching, predictive commoning, peeling, splitting
  #                  paths and the dynamic vector cost model
  #   -flto=auto     [Optimize Options] whole-program optimization with the
  #                  link step run in parallel (GNU make jobserver when
  #                  available, otherwise CPU-count autodetection)
  #   -pipe          [Overall Options] pipes instead of temporary files between
  #                  compiler stages — build speed, no effect on the output
  #   -fno-semantic-interposition  [Optimize Options] without it the compiler
  #                  cannot propagate, inline or otherwise optimize a symbol
  #                  exported from a DSO, since the dynamic linker may replace
  #                  it; this flag lets it assume the replacement would have
  #                  the same semantics. Relevant because CFLAGS_BASE compiles
  #                  with -fPIC.
  #   -fno-plt       [Code Gen Options] call through GOT loads instead of PLT
  #                  stubs, which exposes the address loads to optimization;
  #                  all external symbols then bind at load time (lazy binding
  #                  is not needed for this binary)
  #   -ffunction-sections -fdata-sections [Optimize Options] one section per
  #                  function/data item; the same doc states these pay off
  #                  together with the linker's --gc-sections
  #   -static-libstdc++ [Link Options] freezes libstdc++ into the binary, so
  #                  it runs on distributions older than the build image
  #   -Wl,--gc-sections [Optimize Options: linker garbage collection] drops the
  #                  sections nothing references
  # Already provided by the makefile and therefore not repeated here: -O2
  # (upgraded to -O3 by FLAGS_FLTO), -DNDEBUG, -fPIC, -s (strip),
  # -z noexecstack. -foptimize-crc, which the docs list among the -O2 flags,
  # is thus already on for the CRC-heavy codec paths.
  # ---------------------------------------------------------------------------
  linux-x64:
    name: Linux x64 (GCC, -march=x86-64-v3)
    needs: changes
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    if: github.repository == 'Mitra-88/7zip' && needs.changes.outputs.build == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7

      - name: Build 7zz
        working-directory: CPP/7zip/Bundles/Alone2
        run: |
          make -j"$(nproc)" -f makefile.gcc \
            MY_ARCH="-march=x86-64-v3" \
            FLAGS_FLTO="-O3 -flto=auto -pipe -fno-semantic-interposition -fno-plt -ffunction-sections -fdata-sections" \
            LDFLAGS_STATIC_3="-static-libstdc++ -Wl,--gc-sections" \
            CFLAGS_WARN_WALL="-Wall -Wextra"
          file _o/7zz
          ./_o/7zz i | grep -m1 "7-Zip"

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp CPP/7zip/Bundles/Alone2/_o/7zz dist/
          cp DOC/License.txt dist/

      - name: Upload (transport to release job)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 7zz-linux-x64-v3
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS arm64 (Apple Silicon runner, macos-26 image) — Apple clang 21.
  # Injection points are the same as the Linux job (MY_ARCH, FLAGS_FLTO).
  #   * MY_ARCH="-arch arm64 -mcpu=apple-m1" — arm64 at the Apple M-series
  #     level, the ARM64 counterpart of picking an x86-64 micro-architecture
  #     level: on macOS the CPU is always an Apple core, so the level is named
  #     directly instead of through a psABI ladder. apple-m1 is a documented
  #     -mcpu value — clang's reference sends you to -mcpu=help /
  #     --print-supported-cpus for the list, and --print-enabled-extensions,
  #     documented for AArch64 only, prints the extensions a given -mcpu turns
  #     on; GCC's AArch64 page carries the matching crc / crypto / aes feature
  #     names. This pairs with the MACOSX_DEPLOYMENT_TARGET below: macOS 11 is
  #     the oldest release that runs on Apple Silicon, so no Apple Silicon Mac
  #     is excluded.
  #   * FLAGS_FLTO="-O3 -flto=thin" — same trick as the Linux job. The clang
  #     ThinLTO page describes it as scalable and incremental because the thin
  #     link reads module summaries instead of merging modules, after which the
  #     cross-module optimization backends run in parallel threads; it lists
  #     ld64, Xcode 8 and later, among the supported linkers, and reports
  #     results that match full LTO's performance improvement in many cases.
  #   * CC=clang / CXX=clang++ — explicit, so the makefile skips its GCC-only
  #     "-s" strip flag; we strip with the macOS strip tool instead.
  # No -ffunction-sections/-fdata-sections, -Wl,--gc-sections or -Wl,-dead_strip
  # here: the GCC page pairs the first two with the linker's --gc-sections, and
  # neither that option nor Mach-O's -dead_strip is documented in the clang
  # reference, so nothing Darwin-specific is guessed at here. ThinLTO does the
  # whole-program work instead.
  # ---------------------------------------------------------------------------
  macos-arm64:
    name: macOS arm64 (Apple clang, -mcpu=apple-m1)
    needs: changes
    runs-on: macos-26
    timeout-minutes: 30
    if: github.repository == 'Mitra-88/7zip' && needs.changes.outputs.build == 'true'
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7

      - name: Build 7zz
        working-directory: CPP/7zip/Bundles/Alone2
        run: |
          make -j"$(sysctl -n hw.ncpu)" -f makefile.gcc \
            CC=clang CXX=clang++ \
            MY_ARCH="-arch arm64 -mcpu=apple-m1" \
            FLAGS_FLTO="-O3 -flto=thin" \
            CFLAGS_WARN_WALL="-Wall -Wextra"
          strip _o/7zz
          file _o/7zz
          ./_o/7zz i | grep -m1 "7-Zip"

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp CPP/7zip/Bundles/Alone2/_o/7zz dist/
          cp DOC/License.txt dist/

      - name: Upload (transport to release job)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 7zz-macos-arm64
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Package the three binaries (zip for Windows, tar.gz for the Unix binaries
  # so the executable bit survives) and publish ONE rolling GitHub Release
  # tagged "nightly" — the previous nightly release is deleted first, so the
  # tag always marks the latest nightly build (and is what the `changes` job
  # compares against on the next run).
  # zip/tar/sha256sum/gh are all preinstalled on the ubuntu-26.04 image.
  # ---------------------------------------------------------------------------
  release:
    name: Publish nightly release
    needs: [changes, windows-x64, linux-x64, macos-arm64]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    if: github.repository == 'Mitra-88/7zip' && needs.changes.outputs.build == 'true'
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout (full history, for release notes)
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          fetch-depth: 0

      - name: Download built binaries
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8
        with:
          path: pkgs

      - name: Package and hash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          DATE_STAMP="$(date -u '+%Y-%m-%d')"
          BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"
          BASE_VERSION="$(sed -n 's/^#define MY_VERSION_NUMBERS "\(.*\)"/\1/p' C/7zVersion.h)"

          mkdir -p release-out
          (cd "pkgs/7zz-windows-x64-v3" && zip -9 -q "../../release-out/7zz-windows-x64-v3-${SHORT_SHA}-${DATE_STAMP}.zip" 7zz.exe License.txt)
          tar -czf "release-out/7zz-linux-x64-v3-${SHORT_SHA}-${DATE_STAMP}.tar.gz" -C "pkgs/7zz-linux-x64-v3" 7zz License.txt
          tar -czf "release-out/7zz-macos-arm64-${SHORT_SHA}-${DATE_STAMP}.tar.gz" -C "pkgs/7zz-macos-arm64" 7zz License.txt

          {
            echo "SHORT_SHA=${SHORT_SHA}"
            echo "DATE_STAMP=${DATE_STAMP}"
            echo "BUILD_DATE=${BUILD_DATE}"
            echo "BASE_VERSION=${BASE_VERSION}"
          } >> "$GITHUB_ENV"

          ls -la release-out/

      - name: Build release notes
        run: |
          PREV="$(git rev-parse -q --verify refs/tags/nightly || true)"
          if [ -n "$PREV" ]; then
            CHANGES="$(git log --pretty=format:'* %s (%h)' "${PREV}..${GITHUB_SHA}" | head -20)"
          else
            CHANGES="$(git log -10 --pretty=format:'* %s (%h)')"
          fi
          if [ -z "$CHANGES" ]; then
            CHANGES="* No new commits since the previous nightly; rebuilt with current toolchains."
          fi

          cat > body.md <<EOF
          **Rolling Release**
          * **Base Version:** \`${BASE_VERSION}\`
          * **Build Number:** [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          * **Branch:** [\`${GITHUB_REF_NAME}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME})
          * **Commit:** [\`${SHORT_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})
          * **Built on:** ${BUILD_DATE}

          ## 📝 Recent Changes
          ${CHANGES}

          ## 🔐 File Hashes
          EOF

          for f in release-out/*; do
            {
              echo "* \`$(basename "$f")\`"
              echo "  - SHA-256: \`$(sha256sum "$f" | cut -d' ' -f1)\`"
              echo "  - SHA-512: \`$(sha512sum "$f" | cut -d' ' -f1)\`"
            } >> body.md
          done

      - name: Delete previous nightly release
        run: gh release delete nightly --cleanup-tag --yes || true

      - name: Create nightly release
        run: |
          gh release create nightly \
            --title "Nightly Release (build #${GITHUB_RUN_NUMBER})" \
            --notes-file body.md \
            --target "${GITHUB_SHA}" \
            release-out/*

      - name: Remove transport artifacts
        run: |
          IDS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
                  --paginate \
                  --jq ".artifacts[] | select(.workflow_run.id == ${GITHUB_RUN_ID}) | .id")"
          for id in $IDS; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id" \
              || echo "WARN: could not delete artifact $id (expires on its own in 1 day)"
          done
